name: release

# Packs, verifies the package by consuming it under NativeAOT, and publishes to nuget.org with
# trusted publishing. Nothing here trusts a previous run: the package is consumed from a clean
# project before it is pushed anywhere.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # always a dry run

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  preflight:
    # Seconds, and it runs first. Everything it checks used to be discovered either after a long
    # verify job or, worse, in the publish job after a human had already approved the deployment.
    name: preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: the tag, the project version and the changelog must agree
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' src/DotNetMapper/DotNetMapper.csproj)"

          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag says $tag, DotNetMapper.csproj says $version. Pushing this tag would publish the wrong version."
              exit 1
            fi
            echo "tag and project version agree: $tag"
          else
            echo "workflow_dispatch dry run for version: $version"
          fi

          ./scripts/changelog-section.sh "$version" > /dev/null
          echo "CHANGELOG.md has a section for $version"

          # A stable release ships an empty Unshipped file. The runbook moves it to Shipped.
          if [[ "$version" != *-* ]] && grep -Ev '^#nullable enable[[:space:]]*$' src/DotNetMapper/PublicAPI.Unshipped.txt | grep -q .; then
            echo "::error::PublicAPI.Unshipped.txt has entries for a stable release. Move them to Shipped first."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: pack
        run: dotnet pack src/DotNetMapper/DotNetMapper.csproj -c Release -o out

      - name: assert the expected packages exist
        shell: bash
        run: |
          set -euo pipefail
          test -f "out/DotNetMapper.$VERSION.nupkg" || { echo "::error::missing out/DotNetMapper.$VERSION.nupkg"; exit 1; }
          test -f "out/DotNetMapper.$VERSION.snupkg" || { echo "::error::missing out/DotNetMapper.$VERSION.snupkg"; exit 1; }

      - name: consume the package under NativeAOT
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          ./tests/packaging/verify-package.sh --packages out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            out/*.nupkg
            out/*.snupkg
          retention-days: 30

  publish:
    name: publish
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # NuGet trusted publishing, so there is no long lived key
      attestations: write  # provenance attestation on the nupkg
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: out

      # Trusted publishing. nuget.org validates a short lived GitHub OIDC token against a policy
      # registered for this repository and workflow, and returns a temporary API key. No long
      # lived secret exists to leak or rotate.
      - name: exchange the OIDC token for a temporary api key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: publish to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "out/DotNetMapper.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: attest the package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/DotNetMapper.${{ env.VERSION }}.nupkg

      # Notes come from CHANGELOG.md, not from the commit log. A generated commit list is a
      # record of how the work happened, not what shipped.
      - name: build the release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          {
            ./scripts/changelog-section.sh "$version"
            echo
            echo "### Install"
            echo
            echo '```'
            echo "dotnet add package DotNetMapper --version $version"
            echo '```'
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(release create "$GITHUB_REF_NAME" out/*.nupkg out/*.snupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
